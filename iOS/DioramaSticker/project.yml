name: DioramaSticker
options:
  bundleIdPrefix: com.dioramasticker
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_LANGUAGE: zh-Hans
targets:
  DioramaSticker:
    type: application
    platform: iOS
    sources:
      - path: DioramaSticker
        excludes:
          - Resources/**
      - path: DioramaSticker/Resources
        type: folder
    settings:
      base:
        INFOPLIST_FILE: DioramaSticker/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.dioramasticker.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
